# Smestaj servis je na 8081, ovaj mora biti drugi port
server.port=8082

spring.application.name=rezervacija-servis

# ODVOJENA baza od smestaj-servisa (on koristi hostel_smestaj)
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_rezervacija?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Majklkobleher1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Adresa Eureka servera na koji se ovaj servis registruje
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- Circuit breaker za pozive ka Smestaj servisu ---
# ime instance "smestaj" mora da se poklapa sa @CircuitBreaker(name = "smestaj")

# posmatramo poslednjih 5 poziva
resilience4j.circuitbreaker.instances.smestaj.sliding-window-size=5
# ne odlucujemo nista dok ih ne bude bar 3
resilience4j.circuitbreaker.instances.smestaj.minimum-number-of-calls=3
# ako 50% ili vise padne -> prekidac se otvara
resilience4j.circuitbreaker.instances.smestaj.failure-rate-threshold=50
# koliko stoji otvoren pre nego sto proba ponovo
resilience4j.circuitbreaker.instances.smestaj.wait-duration-in-open-state=10s
# koliko probnih poziva pusta u HALF-OPEN stanju
resilience4j.circuitbreaker.instances.smestaj.permitted-number-of-calls-in-half-open-state=2

# Losi datumi su korisnikova greska, ne kvar Smestaja - ne racunaju se u statistiku
resilience4j.circuitbreaker.instances.smestaj.ignore-exceptions[0]=rs.hostel.rezervacijaservis.exception.BadRequestException
