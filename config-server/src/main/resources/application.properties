server.port=8888

spring.application.name=config-server

# LOKALNI git repo sa konfiguracijom (tri kose crte: file:// + apsolutna putanja).
#
# PAZNJA na cestu zabludu: kod file:// repoa BEZ remote-a, Config server cita
# RADNU KOPIJU sa diska, a ne poslednji commit. Izmena u fajlu se vidi odmah,
# i pre "git commit"-a. (Polje "version" u odgovoru ipak prikazuje HEAD, pa
# ume da zavara.) Razlog: server pokusava "pull" pre citanja, a bez remote-a
# nema odakle da povlaci, pa nikad ne resetuje radnu kopiju.
#
# Commit i dalje treba raditi - zbog istorije izmena, zbog trazenja po labeli
# (/servis/profil/{labela}), i zato sto bi prelazak na pravi (udaljeni) repo
# odmah promenio ponasanje: tamo se servira iskljucivo ono sto je commitovano.
spring.cloud.config.server.git.uri=file:///Users/michaelkobleher/rzkProjekat/config-repo

# Grana koju server cita. "git init" je ovde napravio "main" -
# postavljamo je eksplicitno da ne zavisimo od podrazumevane vrednosti.
spring.cloud.config.server.git.default-label=main
