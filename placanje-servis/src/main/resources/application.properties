# Sve osim ova dva reda je preseljeno na Config server (config-repo).
#
# spring.application.name nije samo ime u Eureki - Config server ga koristi
# kao IME FAJLA koji trazi u config-repo-u: "placanje-servis" -> placanje-servis.properties
spring.application.name=placanje-servis

# Odakle povuci ostatak konfiguracije. Ovo se resava PRE nego sto se
# aplikacija digne, pa Config server mora vec da radi.
# Za "ne rusi se ako Config server nije tu" postoji: optional:configserver:...
spring.config.import=configserver:http://localhost:8888
