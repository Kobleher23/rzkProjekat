# Smestaj je 8081, Rezervacija 8082 -> ovaj mora biti svoj port
server.port=8083

spring.application.name=placanje-servis

# SOPSTVENA baza - svaki mikroservis drzi svoje podatke
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_placanje?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Adresa Eureka servera na koji se ovaj servis registruje
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
